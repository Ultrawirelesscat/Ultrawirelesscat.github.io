name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 workflow 向 GitHub Pages 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布任务，新的推送不会打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整的 git 历史

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # 部署到用户主页仓库（Ultrawirelesscat.github.io）时站点在根路径，base = '/'
        # 如果以后改成项目型仓库（用户名/仓库名），把下面这行换成：
        #   BASE_PATH: /${{ github.event.repository.name }}/
        env:
          BASE_PATH: /
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
